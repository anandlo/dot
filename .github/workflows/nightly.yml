name: Nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flakes:
    name: Nightly flake check
    # macos-26 is a pinned image rather than the moving macos-latest alias.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the first test gate
        uses: ./.github/actions/dot-gate
        with:
          bundle: "false"
          evidence-dir: ${{ runner.temp }}/dot-nightly/run-1
          evidence-label: "Nightly run 1"

      - name: Run the second test gate
        uses: ./.github/actions/dot-gate
        with:
          bundle: "false"
          evidence-dir: ${{ runner.temp }}/dot-nightly/run-2
          evidence-label: "Nightly run 2"

      - name: Run the third test gate
        uses: ./.github/actions/dot-gate
        with:
          bundle: "false"
          evidence-dir: ${{ runner.temp }}/dot-nightly/run-3
          evidence-label: "Nightly run 3"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-nightly-failure-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dot-nightly
            build.log
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: Report a failed nightly
    needs: flakes
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
      - name: Open or comment on the flake issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly flake check failed"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          body="The nightly test gate failed in $RUN_URL. Logs and failure evidence are attached to that run."
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue comment --repo "$GITHUB_REPOSITORY" "$number" --body "$body"
          fi
