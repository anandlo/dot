name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # macos-latest is the macOS 26 arm64 image and carries Xcode 26.x. The
      # Xcode 15.4 this workflow used to pin lives on the macOS 14 image and
      # cannot parse `swift-tools-version: 6.0`. The image's default Xcode is
      # used rather than a pinned path, and the Swift version that actually ran
      # is asserted below, so a renamed Xcode directory cannot silently select a
      # compiler that cannot build the package.
      - name: Select Xcode
        run: |
          sw_vers
          xcodebuild -version
          sudo xcode-select -s /Applications/Xcode.app

      - name: Assert the Swift version
        run: |
          swift --version
          major="$(swift --version | sed -n 's/.*Swift version \([0-9][0-9]*\)\..*/\1/p' | head -1)"
          if [ "${major:-0}" -lt 6 ]; then
            echo "::error::Package.swift declares swift-tools-version 6.0; this image's default toolchain is Swift ${major:-unknown}. Move the job to a newer runner image."
            exit 1
          fi

      - name: Swift Test
        run: swift test --parallel

      - name: Build Application Bundle
        run: ./scripts/build.sh
